services:
  - type: web
    name: auto-director-web
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: auto-director-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: auto-director-queue
          type: keyvalue
          property: connectionString
      - key: TOKEN_SECRET
        generateValue: true
      - key: STUDIO_PASSWORD
        sync: false
      - key: MAX_UPLOAD_MB
        value: '60'

  - type: worker
    name: auto-director-worker
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: auto-director-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: auto-director-queue
          type: keyvalue
          property: connectionString
