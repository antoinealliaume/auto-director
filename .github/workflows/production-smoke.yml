name: Production smoke test

on:
  workflow_run:
    workflows: ["Auto Director CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Wait for Render and verify the deployed release
        env:
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          CURRENT_MAIN="$(git rev-parse HEAD)"
          if [ -z "$EXPECTED_COMMIT" ]; then
            EXPECTED_COMMIT="$CURRENT_MAIN"
          elif [ "$EXPECTED_COMMIT" != "$CURRENT_MAIN" ]; then
            echo "Skipping stale smoke run for $EXPECTED_COMMIT; current main is $CURRENT_MAIN."
            exit 0
          fi
          python tools/production_smoke.py \
            --url https://auto-director-web.onrender.com \
            --expected-commit "$EXPECTED_COMMIT" \
            --wait-seconds 600
