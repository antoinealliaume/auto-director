name: Auto Director CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Audit runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          python -m pip_audit -r requirements.txt
      - name: Compile Python source
        run: python -m compileall -q app engine self_hosted_worker worker.py storage_backend.py storage_schema.py
      - name: Validate browser JavaScript
        run: |
          for file in app/static/*.js; do
            node --check "$file"
          done
      - name: Run Slime Atlas tests
        run: npm test --prefix slime-atlas-3d
      - name: Build static frontend (reference and policy smoke test)
        run: python -m unittest tests.test_frontend_build -v
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path app,self_hosted_worker -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "PowerShell syntax errors in $($_.FullName)" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
            }
          }
          if ($failed) { exit 1 }
      - name: Run core tests
        env:
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/unused
          REDIS_URL: redis://127.0.0.1:6379/0
        run: python -m unittest discover -s tests -v
