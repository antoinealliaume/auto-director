name: Auto Director Continuous Audit

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: auto-director-continuous-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install audit and runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check ruff pip-audit

      - name: Generate continuous audit report
        run: python tools/continuous_audit.py

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-director-audit-${{ github.run_number }}
          path: |
            audit/AUTO_DIRECTOR_AUDIT.md
            audit/AUTO_DIRECTOR_AUDIT.json
          retention-days: 14

      - name: Publish latest report branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/auto-director-audit
          cp audit/AUTO_DIRECTOR_AUDIT.md /tmp/auto-director-audit/
          cp audit/AUTO_DIRECTOR_AUDIT.json /tmp/auto-director-audit/
          git config user.name 'auto-director-audit[bot]'
          git config user.email 'auto-director-audit[bot]@users.noreply.github.com'
          git fetch origin main
          git switch -C automation/audit-report origin/main
          mkdir -p audit
          cp /tmp/auto-director-audit/AUTO_DIRECTOR_AUDIT.md audit/
          cp /tmp/auto-director-audit/AUTO_DIRECTOR_AUDIT.json audit/
          git add audit/AUTO_DIRECTOR_AUDIT.md audit/AUTO_DIRECTOR_AUDIT.json
          git commit -m 'chore(audit): refresh continuous report [skip ci]' || true
          git push --force origin automation/audit-report

      - name: Update continuous audit issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title='Auto Director Continuous Audit'
          issue_number="$(gh issue list --state open --search 'Auto Director Continuous Audit in:title' --json number,title --jq '.[] | select(.title == "Auto Director Continuous Audit") | .number' | head -n 1)"
          if [ -z "$issue_number" ]; then
            gh issue create --title "$title" --body-file audit/AUTO_DIRECTOR_AUDIT.md
          else
            gh issue edit "$issue_number" --body-file audit/AUTO_DIRECTOR_AUDIT.md
          fi
