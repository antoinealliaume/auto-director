<!doctype html><html lang="fr"><meta charset="utf-8"><title>V4 browser validation</title>
<style>body{background:#132329;color:#dcf1d5;font:16px system-ui}iframe{width:1100px;height:700px;border:0}pre{white-space:pre-wrap}</style>
<h1>Validation réelle WebGL — V4</h1><pre id="report">Initialisation…</pre><iframe src="./index.html#s001/4"></iframe>
<script type="module">
const report=document.querySelector('#report'),iframe=document.querySelector('iframe');
const pause=ms=>new Promise(r=>setTimeout(r,ms));
let checks=0;const errors=[];const started=performance.now();
const assert=(x,msg)=>{if(!x)throw Error(msg);checks++;};
try{
 while(!iframe.contentWindow.__viewer?.ready)await pause(100);
 const w=iframe.contentWindow,doc=w.document;
 w.addEventListener('error',e=>errors.push(e.message));
 const gl=doc.querySelector('canvas').getContext('webgl2');
 assert(w.__viewer.mode==='webgl','WebGL unavailable');
 for(let i=1;i<=96;i++){
  const id=`s${String(i).padStart(3,'0')}`;
  await w.__creatures.select(id);
  assert(w.__viewer.ready,`${id} model did not load`);
  for(let tier=0;tier<5;tier++){
   w.__creatures.mutation(tier);
   for(const clip of ['Move','Attack','Spawn']){
    w.__creatures.clip(clip);w.__creatures.seek(.9);
    const frame=w.__rarity.inspect();
    assert(frame.triangles.length>0,`${id}/${tier}/${clip}: empty`);
    assert(gl.getError()===gl.NO_ERROR,`${id}/${tier}/${clip}: GL error`);
   }
  }
  if(i%4===0){report.textContent=`${i}/96 modèles · ${checks} contrôles · ${Math.round((performance.now()-started)/1000)} s`;await pause(10);}
 }
 const toggle=doc.querySelector('#rv-enabled');toggle.click();
 assert(w.__rarity.inspect().triangles.length===0,'Disable effects');toggle.click();
 const reduced=doc.querySelector('#rv-reduced');reduced.click();
 w.__creatures.seek(.2);const first=JSON.stringify(w.__rarity.inspect());w.__creatures.seek(1.4);
 assert(JSON.stringify(w.__rarity.inspect())===first,'Reduced motion');reduced.click();
 w.__creatures.clip('Attack');w.__creatures.seek(.8);
 const before=JSON.stringify(w.__rarity.inspect());w.__creatures.seek(1.3);w.__creatures.seek(.8);
 assert(before===JSON.stringify(w.__rarity.inspect()),'Seek backwards');
 assert(errors.length===0,errors.join('\n'));
 report.textContent=`PASS · 96 modèles GLB · 480 variantes · 1 440 scènes animées · ${checks} contrôles · aucune erreur WebGL ou JavaScript · ${Math.round((performance.now()-started)/1000)} s`;
}catch(e){report.textContent=`FAIL après ${checks} contrôles : ${e.stack}`;}
</script></html>
